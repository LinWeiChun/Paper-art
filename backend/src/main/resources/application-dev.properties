spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:paperart}?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:paperart}
spring.datasource.password=${MYSQLPASSWORD:paperart}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

cloudflare.r2.access-key=${R2_ACCESS_KEY:development-access-key}
cloudflare.r2.secret-key=${R2_SECRET_KEY:development-secret-key}
cloudflare.r2.bucket=${R2_BUCKET:paperart-development}
cloudflare.r2.endpoint=${R2_ENDPOINT:http://localhost:9000}
cloudflare.r2.public-url=${R2_PUBLIC_URL:http://localhost:9000/paperart-development}

jwt.secret=${JWT_SECRET:paperart-development-secret-must-be-at-least-32-bytes}
jwt.cookie-secure=false
csrf.cookie-secure=false

admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:change-me-in-local-environment}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
